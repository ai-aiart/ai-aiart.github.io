name: deploy

# Static site: no build step. Copies the site files into _site and publishes
# them to the gh-pages branch (same target as the previous Jekyll workflow).

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html assets .nojekyll _site/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
